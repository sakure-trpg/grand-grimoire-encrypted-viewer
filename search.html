<!doctype html>
<html lang="ja" class="locked">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>グランドグリモア 呪文検索</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="unlock.css">
  <script src="payload.js" defer></script>
  <script src="unlock.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true">✧</span>
        <div>
          <div class="eyebrow">GRAND GRIMOIRE 1・2</div>
          <h1>呪文検索</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <a id="backToNames" class="back-to-names" href="index.html">← 呪文名一覧</a>
        <span class="total-badge" id="totalBadge">読み込み中</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <label class="visually-hidden" for="searchInput">呪文を検索</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
               placeholder="呪文名・効果・コスト・必要時間で検索" aria-describedby="searchHint">
        <kbd>Ctrl K</kbd>
      </div>
      <p id="searchHint" class="hint">空白で区切ると、すべての語句を含む呪文を探します。</p>
      <div class="toolbar-row">
        <div class="book-filters" role="group" aria-label="出典で絞り込み">
          <button type="button" class="filter active" data-book="all" aria-pressed="true">すべて</button>
          <button type="button" class="filter" data-book="グランドグリモア1" aria-pressed="false">グランドグリモア1</button>
          <button type="button" class="filter" data-book="グランドグリモア2" aria-pressed="false">グランドグリモア2</button>
        </div>
        <label class="sort-label">並び順
          <select id="sortSelect">
            <option value="relevance">関連度・ID順</option>
            <option value="name">名前順</option>
            <option value="id">ID順</option>
          </select>
        </label>
      </div>
    </div>

    <main class="workspace">
      <section class="results-panel" aria-label="検索結果">
        <div class="panel-heading">
          <h2>検索結果</h2>
          <span id="resultCount" aria-live="polite"></span>
        </div>
        <div id="resultList" class="result-list"></div>
      </section>
      <article class="detail-panel" id="detailPanel" aria-label="呪文の詳細">
        <div id="detailContent"></div>
      </article>
    </main>

    <footer class="footer">画像と照合済みの537呪文を収録 · オフラインで利用できます</footer>
  </div>
</body>
</html>
